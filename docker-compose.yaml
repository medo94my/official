version: '3.8'

services:
  # Strapi Headless CMS
  cms:
    build: 
      context: ./cms
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        DATABASE_CLIENT: sqlite
        DATABASE_FILENAME: .tmp/data.db
        JWT_SECRET: super-secret-jwt-token-change-me
        ADMIN_JWT_SECRET: super-secret-admin-jwt-token-change-me
        APP_KEYS: key1,key2,key3,key4
        API_TOKEN_SALT: somesalt
        TRANSFER_TOKEN_SALT: somesalt
    image: my-portfolio-cms
    restart: unless-stopped
    ports:
      - "1337:1337"
    volumes:
      - ./cms:/opt/app
      - /opt/app/node_modules
    environment:
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - JWT_SECRET=super-secret-jwt-token-change-me
      - ADMIN_JWT_SECRET=super-secret-admin-jwt-token-change-me
      - APP_KEYS=key1,key2,key3,key4
      - API_TOKEN_SALT=somesalt
      - TRANSFER_TOKEN_SALT=somesalt
    networks:
      - portfolio-network

  # Vite Frontend
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    image: my-portfolio-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      # Exclude cms directory from frontend context to avoid confusion/loops if mapped poorly
    environment:
      - VITE_STRAPI_URL=http://localhost:1337 # Browser accesses this, so localhost is correct
    depends_on:
      - cms
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
