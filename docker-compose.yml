services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits on this before running migrations.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        # Addressed as `portfolio-db`, not `db`. The app also joins the shared
        # infra-proxy network, where another stack already publishes the alias
        # `db` — a bare `db` there resolves to a foreign Postgres and Prisma
        # fails authentication against it.
        aliases:
          - portfolio-db
    # Not published by default — only the app needs to reach it. Uncomment to
    # run `prisma studio` from the host.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time, so they are build args
      # rather than runtime env.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@portfolio-db:5432/${POSTGRES_DB:-portfolio}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Contact form. All optional: with none of them set, submissions are
      # still saved to the Inquiry table and readable at /admin/dashboard/inbox
      # — only the email notification is skipped. Runtime env, not build args:
      # these are server-side secrets and must never reach the client bundle.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INQUIRY_NOTIFY_TO: ${INQUIRY_NOTIFY_TO:-}
      INQUIRY_NOTIFY_FROM: ${INQUIRY_NOTIFY_FROM:-}
      # Salts the stored IP hash. Rotating it makes existing hashes
      # unlinkable, which is the intent.
      INQUIRY_IP_SALT: ${INQUIRY_IP_SALT:-}
    ports:
      # Loopback only. Public traffic arrives via the infra-proxy network
      # (Traefik -> Cloudflare Tunnel), so port 3000 does not need to be
      # reachable from outside this host.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # Résumé PDF and project images can be swapped without a rebuild.
      - ./public/resume:/app/public/resume:ro
    networks:
      - default
      - infra-proxy

volumes:
  pgdata:

networks:
  # Shared reverse-proxy network. Traefik resolves this container by name over
  # it; declaring it here means the route survives `docker compose up`, which a
  # manual `docker network connect` would not.
  infra-proxy:
    external: true
