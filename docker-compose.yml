services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits on this before running migrations.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        # Addressed as `portfolio-db`, not `db`. The app also joins the shared
        # infra-proxy network, where another stack already publishes the alias
        # `db` — a bare `db` there resolves to a foreign Postgres and Prisma
        # fails authentication against it.
        aliases:
          - portfolio-db
    # Not published by default — only the app needs to reach it. Uncomment to
    # run `prisma studio` from the host.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time, so they are build args
      # rather than runtime env.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@portfolio-db:5432/${POSTGRES_DB:-portfolio}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # One key in front of every model provider. Replaces OPENAI_API_KEY, which
      # nothing reads any more. Runtime env, never a build arg — a build arg is
      # baked into the image layer and readable by anyone who can pull it.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Which model each feature uses. Normally chosen in the settings screen;
      # these exist so a fresh container can be configured before first login.
      MODEL_TEXT: ${MODEL_TEXT:-}
      MODEL_STT: ${MODEL_STT:-}
      MODEL_TTS: ${MODEL_TTS:-}
      MODEL_IMAGE: ${MODEL_IMAGE:-}
      # Encrypts every secret written from /admin/dashboard/settings. Without
      # it that screen still runs but refuses to store secrets, rather than
      # quietly writing API keys into Postgres as plain text — which would put
      # them in every pg_dump and make the settings screen a downgrade dressed
      # up as a convenience.
      SETTINGS_KEY: ${SETTINGS_KEY:-}
      # Lets the project importer list repositories. Optional, and settable
      # from the settings screen instead — a value stored there wins over this.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Contact form. All optional: with none of them set, submissions are
      # still saved to the Inquiry table and readable at /admin/dashboard/inbox
      # — only the email notification is skipped. Runtime env, not build args:
      # these are server-side secrets and must never reach the client bundle.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INQUIRY_NOTIFY_TO: ${INQUIRY_NOTIFY_TO:-}
      INQUIRY_NOTIFY_FROM: ${INQUIRY_NOTIFY_FROM:-}
      # Salts the stored IP hash. Rotating it makes existing hashes
      # unlinkable, which is the intent.
      INQUIRY_IP_SALT: ${INQUIRY_IP_SALT:-}
    ports:
      # Loopback only. Public traffic arrives via the infra-proxy network
      # (Traefik -> Cloudflare Tunnel), so port 3000 does not need to be
      # reachable from outside this host.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # Résumé PDF and project images can be swapped without a rebuild.
      - ./public/resume:/app/public/resume:ro
    # ── Routing ───────────────────────────────────────────────────────────
    # Traefik discovers this container over infra-proxy and reads these.
    #
    # Previously the route lived in Traefik's own file provider, pointing at
    # `http://official-app-1:3000` — a container name derived from this
    # directory's name. Renaming the directory, or setting a different compose
    # project name, silently changed the container name and left Traefik
    # pointing at nothing, with no clue in this repo to explain the 502.
    # Declared here, the route moves with the service whatever it is called.
    #
    # The matching blocks were removed from
    # ~/infra/reverse-proxy/dynamic/services.yml in the same change. Both at
    # once would give Traefik two routers matching the same Host rule —
    # `portfolio@docker` and `portfolio@file` — and which one wins is not
    # something to leave to chance.
    labels:
      # The provider runs with exposedByDefault: false, so this is required.
      traefik.enable: "true"
      traefik.http.routers.portfolio.rule: Host(`portfolio.craftspace.space`)
      traefik.http.routers.portfolio.entrypoints: web
      # `@file` is load-bearing: the middleware is defined in Traefik's file
      # provider, and an unqualified name resolves within the *docker*
      # provider, where it does not exist — the router would fail to start.
      # It sets X-Forwarded-Proto: https, which is how NextAuth knows the
      # original scheme was https despite this hop being plain HTTP. Without
      # it, auth callbacks redirect to http:// and sign-in breaks.
      traefik.http.routers.portfolio.middlewares: sec-headers@file
      # Which container port to reach. The published 127.0.0.1:3000 mapping is
      # for host-local access only and is not what Traefik uses.
      traefik.http.services.portfolio.loadbalancer.server.port: "3000"
    networks:
      - default
      - infra-proxy

volumes:
  pgdata:

networks:
  # Shared reverse-proxy network. Traefik resolves this container by name over
  # it; declaring it here means the route survives `docker compose up`, which a
  # manual `docker network connect` would not.
  infra-proxy:
    external: true
